name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust 1.88.0
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0

      - name: Generate dependency lockfile
        run: cargo generate-lockfile

      - name: Upload dependency lockfile
        uses: actions/upload-artifact@v4
        with:
          name: ci-cargo-lock
          path: Cargo.lock
          if-no-files-found: error
          retention-days: 7

  rust:
    needs: lockfile
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download dependency lockfile
        uses: actions/download-artifact@v4
        with:
          name: ci-cargo-lock
          path: .

      - name: Install Rust 1.88.0
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
          components: rustfmt, clippy

      - name: Show toolchain versions
        run: |
          rustc --version
          cargo --version

      - name: Validate locked workspace metadata
        run: cargo metadata --locked --no-deps --format-version 1 > /dev/null

      - name: Validate release metadata
        run: |
          python3 -m py_compile scripts/package_release.py scripts/verify_release_version.py
          python3 scripts/verify_release_version.py --tag v0.1.0-rc.1

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        shell: bash
        run: |
          set +e
          cargo clippy --workspace --all-targets --locked -- -D warnings > clippy.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            grep -E -B 2 -A 10 '(^error:|^error\[|^warning:)' clippy.log || tail -n 120 clippy.log
          fi
          exit "$status"

      - name: Upload Clippy log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clippy-log
          path: clippy.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Run unit and documentation tests
        run: |
          cargo test --workspace --lib --bins --locked
          cargo test --workspace --doc --locked

      - name: Run release end-to-end tests
        run: cargo test -p fermio-cli --test release_e2e --locked -- --test-threads=1

      - name: Smoke test release packaging
        run: |
          cargo build --locked -p fermio-cli
          python3 scripts/package_release.py \
            --binary target/debug/fermio-sec \
            --target x86_64-unknown-linux-gnu \
            --version ci \
            --output-dir target/release-smoke
          cd target/release-smoke
          sha256sum -c *.sha256
