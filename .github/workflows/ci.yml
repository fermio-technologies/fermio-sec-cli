name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
          components: rustfmt, clippy

      - run: cargo metadata --locked --no-deps --format-version 1

      - name: Validate release metadata
        run: |
          python3 -m py_compile scripts/package_release.py scripts/verify_release_version.py
          python3 scripts/verify_release_version.py --tag v0.1.0-rc.1

      - run: cargo fmt --all -- --check

      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - run: cargo test --workspace --lib --bins --locked

      - run: cargo test --workspace --doc --locked

      - run: cargo test -p fermio-cli --test release_e2e --locked -- --test-threads=1

      - run: cargo build --locked --release -p fermio-cli

      - name: Test release package
        run: |
          python3 scripts/package_release.py \
            --binary target/release/fermio-sec \
            --target x86_64-unknown-linux-gnu \
            --version v0.1.0-rc.1 \
            --output-dir dist
          cd dist
          sha256sum -c *.sha256
