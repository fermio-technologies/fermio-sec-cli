name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify release tag and changelog
        run: python3 scripts/verify_release_version.py --tag "${GITHUB_REF_NAME}"

      - name: Install Rust 1.88.0
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0

      - name: Generate dependency lockfile
        run: cargo generate-lockfile

      - name: Upload release lockfile
        uses: actions/upload-artifact@v4
        with:
          name: release-cargo-lock
          path: Cargo.lock
          if-no-files-found: error
          retention-days: 7

  build:
    needs: lockfile
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download release lockfile
        uses: actions/download-artifact@v4
        with:
          name: release-cargo-lock
          path: .

      - name: Install Rust 1.88.0
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
          targets: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --locked --release --target ${{ matrix.target }} -p fermio-cli

      - name: Package release archive
        shell: bash
        run: |
          binary="target/${{ matrix.target }}/release/fermio-sec"
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            binary="${binary}.exe"
          fi
          python scripts/package_release.py \
            --binary "$binary" \
            --target "${{ matrix.target }}" \
            --version "${GITHUB_REF_NAME}" \
            --output-dir dist

      - name: Upload packaged binary
        uses: actions/upload-artifact@v4
        with:
          name: fermio-sec-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download packaged binaries
        uses: actions/download-artifact@v4
        with:
          pattern: fermio-sec-*
          path: dist
          merge-multiple: true

      - name: Download release lockfile
        uses: actions/download-artifact@v4
        with:
          name: release-cargo-lock
          path: release-lock

      - name: Add release lockfile and checksum
        run: |
          cp release-lock/Cargo.lock "dist/fermio-sec-${GITHUB_REF_NAME}-Cargo.lock"
          cd dist
          sha256sum "fermio-sec-${GITHUB_REF_NAME}-Cargo.lock" > "fermio-sec-${GITHUB_REF_NAME}-Cargo.lock.sha256"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_flags=()
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            release_flags+=(--prerelease)
          fi
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --verify-tag \
            --generate-notes \
            --title "${GITHUB_REF_NAME}" \
            "${release_flags[@]}"
