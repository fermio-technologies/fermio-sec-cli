[workspace]
resolver = "3"
members = [
  "crates/fermio-cli",
  "crates/fermio-config",
  "crates/fermio-core",
  "crates/fermio-engine",
  "crates/fermio-language-api",
  "crates/fermio-language-php",
  "crates/fermio-ir",
  "crates/fermio-rulepack",
  "crates/fermio-rules",
  "crates/fermio-rules-php-oo",
  "crates/fermio-report",
]

[workspace.package]
version = "0.1.0-rc.1"
edition = "2021"
license = "Apache-2.0"
authors = ["Fermio Technologies"]
rust-version = "1.88"

[workspace.dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
ignore = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "1.0"
toml = "0.8"
tree-sitter = "0.24"
tree-sitter-php = "0.23"
walkdir = "2.5"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"
